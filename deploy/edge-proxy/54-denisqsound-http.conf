# denisqsound.tech — HTTP vhost for the shared edge-proxy on the `oracle` host.
#
# HTTP-01 challenges are answered by the short-lived certbot container that
# /opt/denisqsound/renew-cert-denisqsound.sh starts on the `edge` network.
# Everything else redirects to HTTPS.
#
# This file is safe to install before the TLS certificate exists; the TLS
# vhost lives in 55-denisqsound.conf and is only installed by setup-edge.sh
# once /opt/edge-proxy/certs/denisqsound.crt is present.

server {
    listen 80;
    server_name denisqsound.tech www.denisqsound.tech;

    location /.well-known/acme-challenge/ {
        set $upstream_dqs_acme denisqsound-certbot:80;
        proxy_pass http://$upstream_dqs_acme;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
