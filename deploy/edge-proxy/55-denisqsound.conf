# denisqsound.tech — TLS vhost for the shared edge-proxy on the `oracle` host.
#
# Public TCP/443 belongs to the stream SNI router (stream.d), which forwards
# every unmatched SNI to 127.0.0.1:8443 over PROXY protocol. `$connection_upgrade`,
# `resolver 127.0.0.11` and PROXY-protocol real-ip handling are declared once in
# nginx.conf and conf.d/00-realip.conf.
#
# Upstream is addressed through a variable so a restarted or missing
# denisqsound-web container never blocks nginx startup.
#
# Installed by /opt/denisqsound/setup-edge.sh only after the certificate
# exists: referencing a missing ssl_certificate would fail `nginx -t` and
# could block reloads for every site on this proxy.

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name denisqsound.tech www.denisqsound.tech;

    ssl_certificate     /etc/nginx/certs/denisqsound.crt;
    ssl_certificate_key /etc/nginx/certs/denisqsound.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Static site: no uploads.
    client_max_body_size 1m;

    access_log /var/log/nginx/denisqsound.access.log;
    error_log  /var/log/nginx/denisqsound.error.log warn;

    location / {
        set $upstream_dqs_web denisqsound-web:80;
        proxy_pass http://$upstream_dqs_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
