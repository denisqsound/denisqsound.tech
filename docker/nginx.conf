# Static site vhost inside the denisqsound-web container.
# TLS terminates on the host edge-proxy; this only sees plain HTTP on the
# `edge` docker network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        application/javascript
        application/atom+xml
        application/rss+xml
        image/svg+xml
        application/xml
        text/plain;

    # Precompressed-free static assets get a week of cache. HTML stays
    # revalidated so posts show up right after deploy.
    location ~* \.(?:woff2|css|js|svg|png|jpe?g|webp|ico|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
