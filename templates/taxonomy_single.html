{% extends "base.html" %}

{% block title %}{{ term.name }} · {{ config.title }}{% endblock title %}

{% block content %}
<header class="page-head">
  <h1>{{ term.name }}</h1>
</header>
<ul class="post-list">
  {% for p in term.pages %}
  <li>
    <a class="post-link" href="{{ p.permalink }}">{{ p.title }}</a>
    <p class="meta">{{ p.date | date(format="%d.%m.%Y") }}</p>
  </li>
  {% endfor %}
</ul>
{% endblock content %}
